<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 416 214" width="520" height="268" role="img" aria-labelledby="t d" font-family="system-ui, sans-serif" font-size="14">
  <title id="t">One speculative decoding step</title>
  <desc id="d">The drafter proposes four tokens. The target model checks all four in one pass, accepts the first two, rejects the third and samples a replacement, and the fourth draft is discarded. The step outputs three tokens.</desc>
  <text class="fig-label" x="0" y="14" fill="#9a9a9a">Drafter proposes four tokens</text>
  <g class="fig-row">
    <rect class="fig-box" x="0.75" y="24" width="96.5" height="32" rx="4" fill="#1c1c1c" stroke="#303030"/>
    <text class="fig-text" x="49.0" y="45" text-anchor="middle" fill="#ededed">the</text>
    <rect class="fig-box" x="106.75" y="24" width="96.5" height="32" rx="4" fill="#1c1c1c" stroke="#303030"/>
    <text class="fig-text" x="155.0" y="45" text-anchor="middle" fill="#ededed">cat</text>
    <rect class="fig-box" x="212.75" y="24" width="96.5" height="32" rx="4" fill="#1c1c1c" stroke="#303030"/>
    <text class="fig-text" x="261.0" y="45" text-anchor="middle" fill="#ededed">sat</text>
    <rect class="fig-box" x="318.75" y="24" width="96.5" height="32" rx="4" fill="#1c1c1c" stroke="#303030"/>
    <text class="fig-text" x="367.0" y="45" text-anchor="middle" fill="#ededed">on</text>
  </g>
  <text class="fig-label" x="0" y="88" fill="#9a9a9a">Target checks all four in one pass</text>
  <g class="fig-row">
    <rect class="fig-accept" x="0.75" y="98" width="96.5" height="32" rx="4" fill="none" stroke="#4dbc9b" stroke-width="1.5"/>
    <text class="fig-text" x="49.0" y="119" text-anchor="middle" fill="#ededed">accept</text>
    <rect class="fig-accept" x="106.75" y="98" width="96.5" height="32" rx="4" fill="none" stroke="#4dbc9b" stroke-width="1.5"/>
    <text class="fig-text" x="155.0" y="119" text-anchor="middle" fill="#ededed">accept</text>
    <rect class="fig-reject" x="212.75" y="98" width="96.5" height="32" rx="4" fill="none" stroke="#f98473" stroke-width="1.5"/>
    <text class="fig-text" x="261.0" y="119" text-anchor="middle" fill="#ededed">reject</text>
    <rect class="fig-box" x="318.75" y="98" width="96.5" height="32" rx="4" fill="none" stroke="#303030" stroke-dasharray="4 3"/>
    <text class="fig-muted" x="367.0" y="119" text-anchor="middle" fill="#9a9a9a">discarded</text>
  </g>
  <text class="fig-label" x="0" y="162" fill="#9a9a9a">Output: 3 tokens from 1 target pass</text>
  <g class="fig-row">
    <rect class="fig-box" x="0.75" y="172" width="96.5" height="32" rx="4" fill="#1c1c1c" stroke="#303030"/>
    <text class="fig-text" x="49.0" y="193" text-anchor="middle" fill="#ededed">the</text>
    <rect class="fig-box" x="106.75" y="172" width="96.5" height="32" rx="4" fill="#1c1c1c" stroke="#303030"/>
    <text class="fig-text" x="155.0" y="193" text-anchor="middle" fill="#ededed">cat</text>
    <rect class="fig-box" x="212.75" y="172" width="96.5" height="32" rx="4" fill="#1c1c1c" stroke="#303030"/>
    <text class="fig-text" x="261.0" y="193" text-anchor="middle" fill="#ededed">lay</text>
  </g>
</svg>
